<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ledgerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="50%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#06080B"/>
    </linearGradient>

    <!-- Emerald Wing Gradient (Top Bar) -->
    <linearGradient id="ledgerWingTop" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Emerald Stem & Mid Wing Gradient -->
    <linearGradient id="ledgerWingMid" x1="10%" y1="90%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="75%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="ledgerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#10B981" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full Bleed Dark Obsidian Background (Zero white border guaranteed) -->
  <rect width="512" height="512" fill="url(#ledgerBgGrad)"/>

  <!-- Logo Mark Group -->
  <g filter="url(#ledgerGlow)">
    <!-- Top Aerodynamic Ribbon Wing -->
    <path d="M 152 166
             C 152 136, 172 122, 208 122
             L 366 122
             C 386 122, 396 132, 392 148
             C 386 174, 362 192, 334 192
             L 202 192
             C 172 192, 152 182, 152 166 Z"
          fill="url(#ledgerWingTop)"/>

    <!-- Lower Stem & Middle Aerodynamic Crossbar -->
    <path d="M 154 374
             C 152 398, 166 404, 176 384
             C 188 360, 192 312, 192 264
             C 192 238, 212 230, 238 230
             L 324 230
             C 342 230, 350 238, 346 254
             C 338 280, 316 296, 288 296
             L 222 296
             C 188 296, 182 320, 178 354
             C 168 392, 154 398, 154 374 Z"
          fill="url(#ledgerWingMid)"/>
  </g>
</svg>
